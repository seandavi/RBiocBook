<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>

  <!-- ===== edges (drawn first so nodes sit on top) ===== -->
  <g stroke="#8a939b" stroke-width="2" fill="none">
    <!-- root -> level 1 -->
    <line x1="450" y1="104" x2="230" y2="224"/>
    <line x1="450" y1="104" x2="670" y2="224"/>
    <!-- left internal -> leaves -->
    <line x1="230" y1="280" x2="130" y2="404"/>
    <line x1="230" y1="280" x2="330" y2="404"/>
    <!-- right internal -> leaves -->
    <line x1="670" y1="280" x2="570" y2="404"/>
    <line x1="670" y1="280" x2="770" y2="404"/>
  </g>

  <!-- ===== edge labels ===== -->
  <g font-size="14" fill="#495057" text-anchor="middle">
    <g>
      <rect x="324" y="152" width="36" height="20" rx="4" fill="#ffffff"/>
      <text x="342" y="167">no</text>
    </g>
    <g>
      <rect x="540" y="152" width="40" height="20" rx="4" fill="#ffffff"/>
      <text x="560" y="167">yes</text>
    </g>
    <g>
      <rect x="160" y="330" width="36" height="20" rx="4" fill="#ffffff"/>
      <text x="178" y="345">no</text>
    </g>
    <g>
      <rect x="262" y="330" width="40" height="20" rx="4" fill="#ffffff"/>
      <text x="282" y="345">yes</text>
    </g>
    <g>
      <rect x="600" y="330" width="36" height="20" rx="4" fill="#ffffff"/>
      <text x="618" y="345">no</text>
    </g>
    <g>
      <rect x="702" y="330" width="40" height="20" rx="4" fill="#ffffff"/>
      <text x="722" y="345">yes</text>
    </g>
  </g>

  <!-- ===== decision (internal) nodes ===== -->
  <g filter="url(#soft)">
    <!-- root -->
    <rect x="360" y="42" width="180" height="62" rx="12" fill="#dbeafe" stroke="#2780e3" stroke-width="2"/>
    <!-- left internal -->
    <rect x="145" y="224" width="170" height="56" rx="12" fill="#dbeafe" stroke="#2780e3" stroke-width="2"/>
    <!-- right internal -->
    <rect x="585" y="224" width="170" height="56" rx="12" fill="#dbeafe" stroke="#2780e3" stroke-width="2"/>
  </g>
  <g font-size="16" fill="#0b3d6b" text-anchor="middle">
    <text x="450" y="68">Cell-size</text>
    <text x="450" y="89">uniformity &gt; 3?</text>
    <text x="230" y="258">Bare nuclei &gt; 5?</text>
    <text x="670" y="258">Clump thickness &gt; 6?</text>
  </g>

  <!-- ===== leaf nodes ===== -->
  <g filter="url(#soft)">
    <rect x="55"  y="404" width="150" height="54" rx="12" fill="#d1f2e1" stroke="#1a9e5f" stroke-width="2"/>
    <rect x="255" y="404" width="150" height="54" rx="12" fill="#fde2e1" stroke="#d9534f" stroke-width="2"/>
    <rect x="495" y="404" width="150" height="54" rx="12" fill="#d1f2e1" stroke="#1a9e5f" stroke-width="2"/>
    <rect x="695" y="404" width="150" height="54" rx="12" fill="#fde2e1" stroke="#d9534f" stroke-width="2"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="130" y="437" fill="#0b5132">Benign</text>
    <text x="330" y="437" fill="#7a1f1c">Malignant</text>
    <text x="570" y="437" fill="#0b5132">Benign</text>
    <text x="770" y="437" fill="#7a1f1c">Malignant</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="14" fill="#495057">
    <rect x="335" y="500" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2780e3" stroke-width="2"/>
    <text x="360" y="514">decision (split on a feature)</text>
    <rect x="335" y="500" width="0" height="0"/>
  </g>
  <g font-size="14" fill="#495057">
    <rect x="600" y="500" width="18" height="18" rx="4" fill="#eef0f2" stroke="#8a939b" stroke-width="2"/>
    <text x="625" y="514">leaf (predicted class)</text>
  </g>
</svg>
