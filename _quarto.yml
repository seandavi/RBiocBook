project:
  type: book
  # quartobot citation pipeline: resolves persistent-identifier cite keys
  # (@doi:…, @pmid:…) via manubot into references.resolved.bib before render.
  # Hand-curated keys in references.bib are left untouched. Requires the
  # quartobot CLI on PATH (`uv tool install quartobot`).
  pre-render: quartobot resolve --from-scan . --id-mode citation-key

author:
  - name: Sean Davis
    url: https://seandavi.github.io/
    affiliation: University of Colorado<br/>Anschutz School of Medicine
    affiliation-url: https://medschool.cuanschutz.edu/
    email: seandavi@gmail.com
  - name: Lori Shepherd Kern
    affiliation: Roswell Park Comprehensive Cancer Center<br/>Bioconductor Core Team
    affiliation-url: https://www.roswellpark.org/
  - name: Martin Morgan
    affiliation: Roswell Park Comprehensive Cancer Center<br/>Bioconductor Core Team
    affiliation-url: https://www.roswellpark.org/
citation:
  type: book
  title: "The RBioc Book"
  author: "Sean Davis"
  url: https://seandavi.github.io/RBiocBook
  doi: 10.5281/zenodo.20574829
date: "2024-06-01"
date-modified: 'last-modified'
description: |
  A collection of chapters more than a book, but....
execute:
  freeze: auto
lightbox: true


book:
  google-analytics: "G-KLLV1GCF4E"
  title: "The RBioc Book"
  date: "today"
  search: true
  repo-url: https://github.com/seandavi/RBiocBook
  url: https://seandavi.github.io/RBiocBook
  repo-actions: [edit, issue, source]
  downloads: [pdf, epub]
  sharing: [twitter, facebook]
  page-navigation: true
  reader-mode: true

  navbar:
    title: "The RBioc Book"
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About

  chapters:
    - index.qmd
    - part: "Introduction"
      chapters:
        - intro.qmd
        - intro_to_rstudio.qmd
        - r_intro_mechanics.qmd
        - r_basics.qmd
        - packages_and_dice.qmd
        - rproj_and_save_load.qmd
        - reading_and_writing.qmd
    - part: "A Biology Primer"
      chapters:
        - biology_primer.qmd
    - part: data_structures_overview.qmd
      chapters:
        - vectors.qmd
        - matrices.qmd
        - lists.qmd
        - dataframes_intro.qmd
        - factors.qmd
        - control_statements.qmd

    - part: eda_overview.qmd
      chapters:
        - dplyr_intro_msleep.qmd
        - eda_and_univariate_brfss.qmd
        - ggplot2/intro.qmd
        - comparison_options.qmd
        - visualization_guide.qmd

    - part: statistics
      chapters:
        #- working_with_distributions.qmd
        - norm.qmd
        - t-stats-and-tests.qmd
        - kmeans.qmd

    - part: "Machine Learning"
      chapters:
        - machine_learning/intro.qmd
        - machine_learning/models.qmd
        - machine_learning/mlr3verse_intro.qmd
        - machine_learning/ml_cancer.qmd
        - machine_learning/ml_methylation_age.qmd
        - machine_learning/ml_expression.qmd

    - part: "Bioconductor"
      chapters:
        - geoquery.qmd
        - bioc-summarizedexperiment.qmd
        - 310_microbiome.qmd
        - genomic_ranges_tutorial.qmd
        - ranges_and_signals.qmd
        - ranges_exercises.qmd
        - atac-seq/atac-seq.qmd
        - single_cell/setup.qmd
        #- single-cell-atac-and-rna-transfer-learning.qmd
    # - part: "Single Cell"
    #   chapters:
    #     - single_cell/setup.qmd
    
    - references.qmd

  appendices:
    - git_and_github.qmd
    - additional_resources.qmd
    - ai_tools.qmd
    - matrix_exercises.qmd
    #- part: "Bioconductor"
    #chapters:
    #- bioconductor_intro.qmd
    #- bioconductor_packages.qmd
  page-footer:
    center:
      - text: "About"
        href: about.qmd
      - text: "License"
        href: license.qmd

bibliography:
  - references.bib
  - references.resolved.bib

format:
  html:
    code-tools:
      source: repo
    fig-cap-location: margin
    tbl-cap-location: margin
    code-copy: true
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme-dark.scss]
    #fontsize: "15px"
    linestretch: 1.6
    #mainfont: "Roboto"
    #monofont: "Fira Mono"
    smooth-scroll: true
    toc-depth: 3
    code-link: true
    highlight-style: printing
    code-block-bg: true
    code-overflow: wrap
    reference-location: margin
    mermaid:
      theme: neutral
  titlepage-pdf:
    titlepage: academic
    linkcolor: blue
    documentclass: scrbook
    classoption: ["oneside", "open=any"]
    # tbl-cap-location: margin
    # fig-cap-location: margin
    lot: true
    lof: true
    # insert index entries: Markdown\index{Markdown} allows you to write ...
    include-in-header:
      text: |
        \usepackage{makeidx}
        \usepackage{hyperref}
        \makeindex
    include-after-body:
      text: |
        \printindex
  epub:
    cover-image: images/cover.png
