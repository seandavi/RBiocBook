# Render the book inside the prebuilt container image (ghcr.io/seandavi/rbiocbook),
# which already has R + all Bioconductor/CRAN deps + Quarto + TinyTeX + quartobot +
# rsvg-convert. No per-run package install, so render starts in seconds. The image
# is produced by build-image.yml; rebuild it there when DESCRIPTION changes.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

# Serialize runs per ref so a newer commit supersedes an older one. Without this,
# two pushes to main close together (e.g. two PRs merged seconds apart) each run
# `quarto publish gh-pages`, and whichever finishes last wins — so an older
# commit's render can clobber a newer one's published site. Cancelling the
# in-progress run on the same ref guarantees the newest commit is what publishes.
# The ref-keyed group also coalesces rapid pushes to a single PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    # Backstop: a render that hangs (e.g. a stalled remote fetch with no timeout)
    # would otherwise sit until GitHub's 6h default. Cap the whole job; the Render
    # step below also self-bounds with `timeout` so it fails fast with logs.
    timeout-minutes: 45
    container:
      image: ghcr.io/seandavi/rbiocbook:latest
      # GITHUB_TOKEN can pull the repo's own (private) package; make the package
      # public for external/Orchestra use.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Quarto reads GH_TOKEN to authenticate GitHub API calls (the titlepages
      # extension install) and the gh-pages publish uses GITHUB_TOKEN.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Point Quarto at the chrome-headless-shell the image baked under /opt so
      # mermaid diagrams rasterize into the pdf/epub. Set here (not as a global
      # image ENV) because Actions overrides HOME in container jobs, which would
      # otherwise hide the tool; scoping it to the render keeps the multi-user
      # RStudio/Orchestra image's per-user data dirs untouched. See Dockerfile.
      XDG_DATA_HOME: /opt/quarto-data
      # The scrapper render hangs deterministically on the multi-core CI runner
      # (never locally / under emulation) — the signature of a native threading
      # or multithreaded-BLAS deadlock in scrapper's C++ (PCA/SVD, neighbor
      # search). Force single-threaded numerics to rule it out / fix it.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check dependency completeness
        # Fast fail if a chapter uses a package not declared in DESCRIPTION (the
        # image is built from DESCRIPTION, so this also guards image drift).
        run: Rscript tools/check-deps.R

      - name: Install quarto titlepages extension
        # Project-local extension (_extensions/ is gitignored), installed per run.
        run: quarto install extension --no-prompt nmfs-opensci/quarto_titlepages

      - name: Render
        # Self-bounded render. `timeout` aborts a stalled render (SIGINT, then
        # SIGKILL after 60s) so a hung remote fetch fails fast instead of sitting
        # until the job timeout; the log tail is dumped on any non-zero exit, and
        # the R download timeout is capped so a base-R fetch errors rather than
        # hangs. (Add `--debug` to the quarto render below when a stall needs to
        # be traced to a specific sub-process.)
        # shell: bash is required — container `run:` defaults to sh (dash), which
        # rejects `set -o pipefail`.
        shell: bash
        run: |
          export R_DEFAULT_INTERNET_TIMEOUT=120
          set -o pipefail
          timeout --signal=INT --kill-after=60 1800 quarto render --debug 2>&1 | tee /tmp/render.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::group::render.log tail (exit $rc; 124 = step timeout)"
            tail -120 /tmp/render.log
            echo "::endgroup::"
            echo "::error::quarto render failed (exit $rc)"
            exit "$rc"
          fi

      - uses: quarto-dev/quarto-actions/publish@v2
        # Only publish to gh-pages on a push to main, never on a PR.
        if: github.event_name == 'push'
        with:
          target: gh-pages
          render: false

      - name: Commit regenerated _freeze back to main
        # `execute: freeze: auto` reuses committed _freeze/ and only re-executes a
        # chapter when its source changed. This step persists whatever quarto just
        # regenerated, so the NEXT render reuses it instead of re-executing the
        # (slow) chapters from scratch — keeping CI and publishes fast and the
        # executed results deterministic and version-controlled.
        #
        # Push-to-main only. No infinite loop: pushes made with GITHUB_TOKEN do not
        # trigger new workflow runs, and the bot commit is tagged [skip ci] as a
        # belt-and-suspenders guard. A no-op when nothing re-executed (the common
        # case). The job already grants contents: write.
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- _freeze)" ]; then
            echo "No _freeze changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _freeze
          git commit -m "chore(freeze): cache regenerated execution results [skip ci]"
          # Fast-forward in the common case; if main advanced mid-render, merge
          # (never rebase) and retry. cancel-in-progress usually preempts this race.
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

  # Fast HTML-only Netlify deploy preview for PRs. Runs alongside (not instead of)
  # the full R-CMD-check job, so pdf/epub breakage is still caught on the PR.
  preview-render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/seandavi/rbiocbook:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install quarto titlepages extension
        run: quarto install extension --no-prompt nmfs-opensci/quarto_titlepages

      - name: Render (HTML only)
        # Committed _freeze/ means only changed chapters re-execute; the rest reuse
        # frozen results, so previews stay fast.
        run: quarto render --to html

      - name: Add noindex header
        # Keep ephemeral preview copies out of search results so they never compete
        # with the canonical gh-pages book. Netlify honors a _headers file at the
        # root of a prebuilt deploy directory. Block scalar (|) so the embedded
        # "Tag: noindex" colon-space isn't parsed as YAML mapping syntax.
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > _book/_headers

      - uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: _book

  # Deploy job runs on a stock runner (not the R container) because the Netlify
  # action is a Node action and the render image has no Node.
  preview-deploy:
    if: github.event_name == 'pull_request'
    needs: preview-render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the preview URL as a PR comment
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book-html
          path: _book

      - name: Deploy preview to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: _book
          production-deploy: false
          deploy-message: "PR #${{ github.event.number }} preview"
          enable-pull-request-comment: true
          enable-commit-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
