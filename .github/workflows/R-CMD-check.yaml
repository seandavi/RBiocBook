# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Quarto reads GH_TOKEN (not GITHUB_PAT) to authenticate its GitHub API
      # calls; without it, `quarto install tinytex` and the titlepages extension
      # install hit the API unauthenticated and get a 403 (rate limit).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The gh-pages publish step authenticates its git push with GITHUB_TOKEN.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Check dependency completeness
        # Fast fail (seconds) BEFORE the slow install + render if any chapter
        # uses a package not declared in DESCRIPTION. The book renders by reusing
        # committed _freeze, so an undeclared dep stays hidden until a chapter is
        # edited and re-executes — this catches that at lint time. See
        # tools/check-deps.R.
        run: Rscript tools/check-deps.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install R package dependencies
        # Install the DESCRIPTION Depends: via BiocManager so CRAN + Bioconductor
        # packages resolve together. (The old devtools::install_deps() path now
        # fails on current devtools: install_deps() is deprecated and errors with
        # "The package remotes is required".)
        run: |
          Rscript -e '
            install.packages("BiocManager", repos="https://cloud.r-project.org")
            options(repos = BiocManager::repositories())
            deps <- read.dcf("DESCRIPTION")[1, "Depends"]
            deps <- trimws(gsub("[(].*?[)]", "", strsplit(deps, ",")[[1]]))
            deps <- deps[deps != "" & deps != "R"]
            BiocManager::install(deps, update = TRUE, ask = FALSE)
          '

      - name: setup-quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: install quarto titlepages
        run: quarto install extension --no-prompt nmfs-opensci/quarto_titlepages
      - name: install quartobot
        # `quarto render` below runs the `quartobot resolve` pre-render hook
        # declared in _quarto.yml; quartobot must be on PATH or render fails.
        run: pipx install quartobot
      - uses: quarto-dev/quarto-actions/render@v2
      - uses: quarto-dev/quarto-actions/publish@v2
        # Pin the provider: without `target`, `quarto publish` can't choose
        # among recorded publishes and errors ("Multiple previous publishes
        # exist"). `render: false` reuses the _book/ output from the render
        # step above instead of rendering the whole book a second time.
        with:
          target: gh-pages
          render: false
