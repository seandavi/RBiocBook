<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="na" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <text x="390" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3742">Choosing an annotation strategy</text>

  <!-- start -->
  <rect x="60" y="40" width="180" height="38" rx="6" fill="#eef2f7" stroke="#9fb3c8"/>
  <text x="150" y="64" text-anchor="middle" font-size="12.5" fill="#33414d">Clusters in hand</text>
  <line x1="150" y1="78" x2="150" y2="92" stroke="#555" stroke-width="1.6" marker-end="url(#na)"/>

  <!-- decision 1 -->
  <polygon points="150,94 250,132 150,170 50,132" fill="#fbf3e8" stroke="#d9a05b"/>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#7a5a1e">Good reference atlas</text>
  <text x="150" y="142" text-anchor="middle" font-size="11" fill="#7a5a1e">for this tissue?</text>

  <!-- d1 yes -> O1 -->
  <line x1="250" y1="132" x2="458" y2="132" stroke="#555" stroke-width="1.6" marker-end="url(#na)"/>
  <text x="300" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d7a3d">yes</text>
  <!-- d1 no -> d2 -->
  <line x1="150" y1="170" x2="150" y2="218" stroke="#555" stroke-width="1.6" marker-end="url(#na)"/>
  <text x="165" y="196" font-size="11" font-weight="bold" fill="#b05a2a">no</text>

  <!-- decision 2 -->
  <polygon points="150,220 250,258 150,296 50,258" fill="#fbf3e8" stroke="#d9a05b"/>
  <text x="150" y="254" text-anchor="middle" font-size="11" fill="#7a5a1e">Known marker</text>
  <text x="150" y="268" text-anchor="middle" font-size="11" fill="#7a5a1e">genes available?</text>

  <!-- d2 yes -> O2 -->
  <line x1="250" y1="258" x2="458" y2="258" stroke="#555" stroke-width="1.6" marker-end="url(#na)"/>
  <text x="300" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d7a3d">yes</text>
  <!-- d2 no -> elbow -> O3 -->
  <path d="M150,296 L150,372 L458,372" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#na)"/>
  <text x="165" y="320" font-size="11" font-weight="bold" fill="#b05a2a">no</text>

  <!-- outcome boxes -->
  <g>
    <rect x="460" y="110" width="252" height="44" rx="7" fill="#f4f8fd" stroke="#7ba6d4"/>
    <text x="586" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#28527e">Reference-based transfer</text>
    <text x="586" y="145" text-anchor="middle" font-size="11" fill="#4a6480">SingleR / Azimuth</text>

    <rect x="460" y="236" width="252" height="44" rx="7" fill="#f4f8fd" stroke="#7ba6d4"/>
    <text x="586" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#28527e">Marker-based scoring</text>
    <text x="586" y="271" text-anchor="middle" font-size="11" fill="#4a6480">match curated signatures</text>

    <rect x="460" y="350" width="252" height="44" rx="7" fill="#f4f8fd" stroke="#7ba6d4"/>
    <text x="586" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#28527e">Manual interpretation</text>
    <text x="586" y="385" text-anchor="middle" font-size="11" fill="#4a6480">inspect DE + literature</text>
  </g>

  <!-- convergence bus to final -->
  <path d="M712,132 L740,132 L740,440" fill="none" stroke="#7a8893" stroke-width="1.5"/>
  <path d="M712,258 L740,258" fill="none" stroke="#7a8893" stroke-width="1.5"/>
  <path d="M712,372 L740,372" fill="none" stroke="#7a8893" stroke-width="1.5"/>
  <circle cx="740" cy="258" r="2.6" fill="#7a8893"/>
  <circle cx="740" cy="372" r="2.6" fill="#7a8893"/>
  <path d="M740,440 L719,440" fill="none" stroke="#7a8893" stroke-width="1.5" marker-end="url(#na)"/>

  <!-- final node -->
  <rect x="455" y="418" width="262" height="44" rx="22" fill="#eef6ee" stroke="#5a9e5a" stroke-width="1.6"/>
  <text x="586" y="445" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b2f">Annotated cell types</text>
</svg>
