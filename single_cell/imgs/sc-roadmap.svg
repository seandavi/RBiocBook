<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arrW" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== Primary analysis spine ===== -->
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">From reads to a clean, calibrated count matrix</text>
  <g font-size="13" fill="#1f2d3d">
    <rect x="120" y="44" width="150" height="40" rx="6" fill="#eef2f7" stroke="#9fb3c8"/>
    <text x="195" y="69" text-anchor="middle">Count matrix</text>
    <rect x="330" y="44" width="120" height="40" rx="6" fill="#eef2f7" stroke="#9fb3c8"/>
    <text x="390" y="69" text-anchor="middle">QC</text>
    <rect x="510" y="44" width="170" height="40" rx="6" fill="#eef2f7" stroke="#9fb3c8"/>
    <text x="595" y="69" text-anchor="middle">Normalization</text>
  </g>
  <line x1="270" y1="64" x2="328" y2="64" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="450" y1="64" x2="508" y2="64" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- split down to the two parts -->
  <path d="M595,84 L595,108 L300,108 L300,150" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrW)"/>
  <path d="M595,84 L595,108 L690,108 L690,150" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrW)"/>

  <!-- ===== Part A ===== -->
  <rect x="40" y="150" width="520" height="370" rx="12" fill="#f5f9f2" stroke="#86b563" stroke-width="2"/>
  <text x="300" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#3d6b1f">Part A — Structure within a sample</text>
  <text x="300" y="198" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a7a3f">"What cell types are here?"</text>

  <g font-size="13" fill="#1f2d3d">
    <rect x="100" y="218" width="400" height="38" rx="6" fill="#ffffff" stroke="#86b563"/>
    <text x="300" y="242" text-anchor="middle">Feature selection &#8212; highly variable genes</text>
    <rect x="100" y="274" width="400" height="38" rx="6" fill="#ffffff" stroke="#86b563"/>
    <text x="300" y="298" text-anchor="middle">Dimensionality reduction &#8212; PCA, then t-SNE/UMAP</text>
    <rect x="100" y="330" width="400" height="38" rx="6" fill="#ffffff" stroke="#86b563"/>
    <text x="300" y="354" text-anchor="middle">Clustering &#8212; graph-based communities</text>
    <rect x="100" y="386" width="400" height="38" rx="6" fill="#ffffff" stroke="#86b563"/>
    <text x="300" y="410" text-anchor="middle">Marker genes &#8212; what defines each cluster</text>
    <rect x="100" y="442" width="400" height="38" rx="6" fill="#ffffff" stroke="#86b563"/>
    <text x="300" y="466" text-anchor="middle">Annotation &#8212; attach a cell-type identity</text>
  </g>
  <g stroke="#86b563" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="300" y1="256" x2="300" y2="272"/>
    <line x1="300" y1="312" x2="300" y2="328"/>
    <line x1="300" y1="368" x2="300" y2="384"/>
    <line x1="300" y1="424" x2="300" y2="440"/>
  </g>

  <!-- ===== Hinge ===== -->
  <path d="M560,250 L612,250" fill="none" stroke="#c98a2b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Part B ===== -->
  <rect x="612" y="150" width="308" height="370" rx="12" fill="#fbf6ef" stroke="#d9a05b" stroke-width="2"/>
  <text x="766" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#a8651a">Part B — Across samples</text>
  <text x="766" y="198" text-anchor="middle" font-size="12.5" font-style="italic" fill="#b07a36">"What changed?"</text>

  <g font-size="12.5" fill="#1f2d3d">
    <rect x="636" y="222" width="260" height="56" rx="6" fill="#fff7ec" stroke="#d9a05b"/>
    <text x="766" y="245" text-anchor="middle" font-weight="bold">Integration / batch correction</text>
    <text x="766" y="265" text-anchor="middle" font-size="11.5" fill="#6b5636">the hinge between A and B</text>

    <rect x="636" y="312" width="260" height="56" rx="6" fill="#ffffff" stroke="#d9a05b"/>
    <text x="766" y="335" text-anchor="middle" font-weight="bold">Differential expression</text>
    <text x="766" y="355" text-anchor="middle" font-size="11.5" fill="#6b5636">pseudobulk across samples</text>

    <rect x="636" y="402" width="260" height="56" rx="6" fill="#ffffff" stroke="#d9a05b"/>
    <text x="766" y="425" text-anchor="middle" font-weight="bold">Differential abundance</text>
    <text x="766" y="445" text-anchor="middle" font-size="11.5" fill="#6b5636">did the cell-type mix shift?</text>
  </g>
  <g stroke="#d9a05b" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="766" y1="278" x2="766" y2="310"/>
    <line x1="766" y1="368" x2="766" y2="400"/>
  </g>

  <!-- ===== One object footer ===== -->
  <rect x="40" y="528" width="880" height="26" rx="6" fill="#eaecef" stroke="#b8c0c9"/>
  <text x="480" y="546" text-anchor="middle" font-size="12.5" font-style="italic" fill="#42505f">Every step reads from and writes to one SingleCellExperiment object</text>
</svg>
