<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Sum cells into one profile per sample &#215; cell type</text>

  <!-- ===== Stage 1: per-cell, grouped by sample, colored by cell type ===== -->
  <text x="160" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Per-cell counts</text>
  <text x="160" y="80" text-anchor="middle" font-size="11" fill="#777">grouped by sample, colored by cell type</text>

  <!-- helper: clusters of dots for each sample. Two cell types: A=#4575b4, B=#d73027 -->
  <!-- Sample 1 (control) -->
  <g>
    <rect x="60" y="95" width="200" height="80" rx="8" fill="#f7f7f7" stroke="#cccccc"/>
    <text x="160" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Sample 1 (control)</text>
    <!-- type A cluster -->
    <g fill="#4575b4">
      <circle cx="95" cy="138" r="5"/><circle cx="110" cy="150" r="5"/><circle cx="85" cy="155" r="5"/>
      <circle cx="105" cy="135" r="5"/><circle cx="120" cy="145" r="5"/><circle cx="92" cy="146" r="5"/>
    </g>
    <!-- type B cluster -->
    <g fill="#d73027">
      <circle cx="200" cy="140" r="5"/><circle cx="215" cy="150" r="5"/><circle cx="225" cy="138" r="5"/>
      <circle cx="208" cy="158" r="5"/><circle cx="222" cy="160" r="5"/>
    </g>
  </g>
  <!-- Sample 2 (control) -->
  <g>
    <rect x="60" y="185" width="200" height="80" rx="8" fill="#f7f7f7" stroke="#cccccc"/>
    <text x="160" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Sample 2 (control)</text>
    <g fill="#4575b4">
      <circle cx="95" cy="228" r="5"/><circle cx="110" cy="240" r="5"/><circle cx="88" cy="245" r="5"/>
      <circle cx="105" cy="225" r="5"/><circle cx="120" cy="238" r="5"/>
    </g>
    <g fill="#d73027">
      <circle cx="200" cy="230" r="5"/><circle cx="215" cy="240" r="5"/><circle cx="225" cy="228" r="5"/>
      <circle cx="208" cy="248" r="5"/><circle cx="222" cy="250" r="5"/><circle cx="195" cy="242" r="5"/>
    </g>
  </g>
  <!-- Sample 3 (treatment) -->
  <g>
    <rect x="60" y="275" width="200" height="80" rx="8" fill="#fdf2f2" stroke="#e7b3b0"/>
    <text x="160" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#a8322a">Sample 3 (treatment)</text>
    <g fill="#4575b4">
      <circle cx="95" cy="318" r="5"/><circle cx="110" cy="330" r="5"/><circle cx="88" cy="335" r="5"/>
      <circle cx="105" cy="315" r="5"/>
    </g>
    <g fill="#d73027">
      <circle cx="200" cy="320" r="5"/><circle cx="215" cy="330" r="5"/><circle cx="225" cy="318" r="5"/>
      <circle cx="208" cy="338" r="5"/><circle cx="222" cy="340" r="5"/><circle cx="195" cy="332" r="5"/><circle cx="212" cy="348" r="5"/>
    </g>
  </g>

  <text x="290" y="228" text-anchor="middle" font-size="11" fill="#666">sum within</text>
  <text x="290" y="243" text-anchor="middle" font-size="11" fill="#666">each group</text>
  <line x1="268" y1="265" x2="345" y2="265" stroke="#555" stroke-width="1.8" marker-end="url(#pa)"/>

  <!-- ===== Stage 2: pseudobulk matrix ===== -->
  <text x="500" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Pseudobulk matrix</text>
  <text x="500" y="80" text-anchor="middle" font-size="11" fill="#777">genes &#215; (sample &#215; cell type)</text>

  <!-- matrix grid: rows = genes (4), cols = 6 (3 samples x 2 types) -->
  <g font-size="9">
    <!-- column headers -->
    <text x="385" y="100" text-anchor="middle" fill="#4575b4">S1&#183;A</text>
    <text x="425" y="100" text-anchor="middle" fill="#d73027">S1&#183;B</text>
    <text x="465" y="100" text-anchor="middle" fill="#4575b4">S2&#183;A</text>
    <text x="505" y="100" text-anchor="middle" fill="#d73027">S2&#183;B</text>
    <text x="545" y="100" text-anchor="middle" fill="#4575b4">S3&#183;A</text>
    <text x="585" y="100" text-anchor="middle" fill="#d73027">S3&#183;B</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <!-- 4 rows x 6 cols, shaded -->
    <!-- row1 --><rect x="365" y="108" width="40" height="28" fill="#cde0f0"/><rect x="405" y="108" width="40" height="28" fill="#f6cfcb"/><rect x="445" y="108" width="40" height="28" fill="#bdd6ec"/><rect x="485" y="108" width="40" height="28" fill="#f3c3be"/><rect x="525" y="108" width="40" height="28" fill="#a8c8e6"/><rect x="565" y="108" width="40" height="28" fill="#ee9d96"/>
    <!-- row2 --><rect x="365" y="136" width="40" height="28" fill="#a8c8e6"/><rect x="405" y="136" width="40" height="28" fill="#ee9d96"/><rect x="445" y="136" width="40" height="28" fill="#bdd6ec"/><rect x="485" y="136" width="40" height="28" fill="#f3c3be"/><rect x="525" y="136" width="40" height="28" fill="#cde0f0"/><rect x="565" y="136" width="40" height="28" fill="#f6cfcb"/>
    <!-- row3 --><rect x="365" y="164" width="40" height="28" fill="#bdd6ec"/><rect x="405" y="164" width="40" height="28" fill="#f3c3be"/><rect x="445" y="164" width="40" height="28" fill="#a8c8e6"/><rect x="485" y="164" width="40" height="28" fill="#ee9d96"/><rect x="525" y="164" width="40" height="28" fill="#bdd6ec"/><rect x="565" y="164" width="40" height="28" fill="#f3c3be"/>
    <!-- row4 --><rect x="365" y="192" width="40" height="28" fill="#cde0f0"/><rect x="405" y="192" width="40" height="28" fill="#f6cfcb"/><rect x="445" y="192" width="40" height="28" fill="#cde0f0"/><rect x="485" y="192" width="40" height="28" fill="#f6cfcb"/><rect x="525" y="192" width="40" height="28" fill="#a8c8e6"/><rect x="565" y="192" width="40" height="28" fill="#ee9d96"/>
  </g>
  <text x="352" y="128" text-anchor="end" font-size="9" fill="#555">gene 1</text>
  <text x="352" y="156" text-anchor="end" font-size="9" fill="#555">gene 2</text>
  <text x="352" y="184" text-anchor="end" font-size="9" fill="#555">gene 3</text>
  <text x="352" y="212" text-anchor="end" font-size="9" fill="#555">gene 4</text>

  <text x="500" y="245" text-anchor="middle" font-size="11" fill="#666">one column per sample &#215; cell type &#8212; replicates are now samples</text>

  <line x1="615" y1="165" x2="690" y2="165" stroke="#555" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="652" y="156" text-anchor="middle" font-size="11" fill="#666">per cell type</text>

  <!-- ===== Stage 3: DE test ===== -->
  <rect x="700" y="108" width="210" height="120" rx="10" fill="#eef6ee" stroke="#5a9e5a"/>
  <text x="805" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b2f">Bulk DE test</text>
  <text x="805" y="156" text-anchor="middle" font-size="12" fill="#33572f">DESeq2 / edgeR</text>
  <text x="805" y="180" text-anchor="middle" font-size="11" fill="#4a6b48">control vs treatment,</text>
  <text x="805" y="196" text-anchor="middle" font-size="11" fill="#4a6b48">one cell type at a time</text>
  <text x="805" y="218" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b8a68">calibrated p-values</text>

  <!-- ===== footer note ===== -->
  <rect x="60" y="395" width="850" height="48" rx="8" fill="#fbf3e8" stroke="#e0b87a"/>
  <text x="485" y="416" text-anchor="middle" font-size="12.5" fill="#7a5a1e">Cells from one animal are correlated measurements of that animal, not independent replicates.</text>
  <text x="485" y="434" text-anchor="middle" font-size="12.5" fill="#7a5a1e">Aggregating to pseudobulk makes the <tspan font-style="italic" font-weight="bold">sample</tspan> the unit of analysis &#8212; the level at which biology actually varies.</text>
</svg>
