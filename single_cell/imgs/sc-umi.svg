<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ua" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <text x="490" y="26" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2c3742">From pooled reads to a per-cell count matrix</text>
  <text x="490" y="46" text-anchor="middle" font-size="12.5" fill="#6a7681">cell barcode = <tspan font-weight="bold">which cell</tspan> &#160;&#183;&#160; UMI (swatch color) = <tspan font-weight="bold">which molecule</tspan></text>

  <!-- ================= COLUMN A: pooled reads ================= -->
  <text x="90" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#41505f">Sequenced reads</text>
  <text x="90" y="96" text-anchor="middle" font-size="10.5" fill="#8a949e">pooled, one big library</text>

  <!-- read glyph: [cell chip][UMI swatch][gene]  width 20+20+66 -->
  <!-- r1 C1 orange ACTB -->
  <g font-size="10">
    <rect x="34" y="108" width="20" height="22" fill="#cfe0f3" stroke="#7ba6d4"/><text x="44" y="123" text-anchor="middle" font-weight="bold" fill="#28527e">C1</text>
    <rect x="54" y="108" width="20" height="22" fill="#ef9a3d"/>
    <rect x="74" y="108" width="66" height="22" fill="#fff" stroke="#cfd6dd"/><text x="107" y="123" text-anchor="middle" fill="#33414d">ACTB</text>
  </g>
  <!-- r2 C2 teal GAPDH -->
  <g font-size="10">
    <rect x="34" y="140" width="20" height="22" fill="#f3d4e6" stroke="#d48bb6"/><text x="44" y="155" text-anchor="middle" font-weight="bold" fill="#8e3a6b">C2</text>
    <rect x="54" y="140" width="20" height="22" fill="#34b3c4"/>
    <rect x="74" y="140" width="66" height="22" fill="#fff" stroke="#cfd6dd"/><text x="107" y="155" text-anchor="middle" fill="#33414d">GAPDH</text>
  </g>
  <!-- r3 C1 orange ACTB (dup) -->
  <g font-size="10">
    <rect x="34" y="172" width="20" height="22" fill="#cfe0f3" stroke="#7ba6d4"/><text x="44" y="187" text-anchor="middle" font-weight="bold" fill="#28527e">C1</text>
    <rect x="54" y="172" width="20" height="22" fill="#ef9a3d"/>
    <rect x="74" y="172" width="66" height="22" fill="#fff" stroke="#cfd6dd"/><text x="107" y="187" text-anchor="middle" fill="#33414d">ACTB</text>
  </g>
  <!-- r4 C1 green ARL1 -->
  <g font-size="10">
    <rect x="34" y="204" width="20" height="22" fill="#cfe0f3" stroke="#7ba6d4"/><text x="44" y="219" text-anchor="middle" font-weight="bold" fill="#28527e">C1</text>
    <rect x="54" y="204" width="20" height="22" fill="#6bbf59"/>
    <rect x="74" y="204" width="66" height="22" fill="#fff" stroke="#cfd6dd"/><text x="107" y="219" text-anchor="middle" fill="#33414d">ARL1</text>
  </g>
  <!-- r5 C2 teal GAPDH (dup) -->
  <g font-size="10">
    <rect x="34" y="236" width="20" height="22" fill="#f3d4e6" stroke="#d48bb6"/><text x="44" y="251" text-anchor="middle" font-weight="bold" fill="#8e3a6b">C2</text>
    <rect x="54" y="236" width="20" height="22" fill="#34b3c4"/>
    <rect x="74" y="236" width="66" height="22" fill="#fff" stroke="#cfd6dd"/><text x="107" y="251" text-anchor="middle" fill="#33414d">GAPDH</text>
  </g>
  <!-- r6 C1 purple ARL1 -->
  <g font-size="10">
    <rect x="34" y="268" width="20" height="22" fill="#cfe0f3" stroke="#7ba6d4"/><text x="44" y="283" text-anchor="middle" font-weight="bold" fill="#28527e">C1</text>
    <rect x="54" y="268" width="20" height="22" fill="#9b6dd1"/>
    <rect x="74" y="268" width="66" height="22" fill="#fff" stroke="#cfd6dd"/><text x="107" y="283" text-anchor="middle" fill="#33414d">ARL1</text>
  </g>

  <!-- arrow 1 -->
  <text x="196" y="180" text-anchor="middle" font-size="10.5" fill="#55626d">1. group by</text>
  <text x="196" y="194" text-anchor="middle" font-size="10.5" fill="#55626d">cell barcode</text>
  <line x1="150" y1="205" x2="244" y2="205" stroke="#555" stroke-width="1.6" marker-end="url(#ua)"/>
  <text x="196" y="222" text-anchor="middle" font-size="10" font-style="italic" fill="#8a949e">which cell</text>

  <!-- ================= COLUMN B: grouped into cells ================= -->
  <!-- Cell 1 bin -->
  <rect x="258" y="92" width="132" height="178" rx="8" fill="#f4f8fd" stroke="#7ba6d4"/>
  <text x="324" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#28527e">Cell 1 (C1)</text>
  <g font-size="10">
    <rect x="272" y="120" width="18" height="20" fill="#ef9a3d"/><rect x="290" y="120" width="86" height="20" fill="#fff" stroke="#dde3e9"/><text x="333" y="134" text-anchor="middle" fill="#33414d">ACTB</text>
    <rect x="272" y="146" width="18" height="20" fill="#ef9a3d"/><rect x="290" y="146" width="86" height="20" fill="#fff" stroke="#dde3e9"/><text x="333" y="160" text-anchor="middle" fill="#33414d">ACTB</text>
    <rect x="272" y="180" width="18" height="20" fill="#6bbf59"/><rect x="290" y="180" width="86" height="20" fill="#fff" stroke="#dde3e9"/><text x="333" y="194" text-anchor="middle" fill="#33414d">ARL1</text>
    <rect x="272" y="206" width="18" height="20" fill="#9b6dd1"/><rect x="290" y="206" width="86" height="20" fill="#fff" stroke="#dde3e9"/><text x="333" y="220" text-anchor="middle" fill="#33414d">ARL1</text>
  </g>
  <text x="324" y="246" text-anchor="middle" font-size="9.5" fill="#9aa5b1">two orange = PCR copies</text>
  <text x="324" y="260" text-anchor="middle" font-size="9.5" fill="#9aa5b1">green &#8800; purple = 2 molecules</text>

  <!-- Cell 2 bin -->
  <rect x="258" y="286" width="132" height="92" rx="8" fill="#fdf3f8" stroke="#d48bb6"/>
  <text x="324" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e3a6b">Cell 2 (C2)</text>
  <g font-size="10">
    <rect x="272" y="314" width="18" height="20" fill="#34b3c4"/><rect x="290" y="314" width="86" height="20" fill="#fff" stroke="#dde3e9"/><text x="333" y="328" text-anchor="middle" fill="#33414d">GAPDH</text>
    <rect x="272" y="340" width="18" height="20" fill="#34b3c4"/><rect x="290" y="340" width="86" height="20" fill="#fff" stroke="#dde3e9"/><text x="333" y="354" text-anchor="middle" fill="#33414d">GAPDH</text>
  </g>

  <!-- arrow 2 -->
  <text x="446" y="180" text-anchor="middle" font-size="10.5" fill="#55626d">2. collapse reads</text>
  <text x="446" y="194" text-anchor="middle" font-size="10.5" fill="#55626d">sharing a UMI</text>
  <line x1="396" y1="205" x2="496" y2="205" stroke="#555" stroke-width="1.6" marker-end="url(#ua)"/>
  <text x="446" y="222" text-anchor="middle" font-size="10" font-style="italic" fill="#8a949e">which molecule</text>

  <!-- ================= COLUMN C: count matrix ================= -->
  <text x="600" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#41505f">Count matrix</text>
  <text x="600" y="126" text-anchor="middle" font-size="10.5" fill="#8a949e">one column per cell</text>

  <!-- column headers -->
  <text x="588" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#28527e">Cell 1</text>
  <text x="652" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e3a6b">Cell 2</text>
  <!-- row labels -->
  <g font-size="11" fill="#33414d">
    <text x="548" y="178" text-anchor="end">ACTB</text>
    <text x="548" y="218" text-anchor="end">ARL1</text>
    <text x="548" y="258" text-anchor="end">GAPDH</text>
  </g>
  <!-- cells: Cell1 col x=558..618, Cell2 col x=622..682 -->
  <g stroke="#ffffff" stroke-width="2" font-size="13" text-anchor="middle">
    <!-- ACTB -->
    <rect x="558" y="160" width="60" height="34" fill="#9ec7ea"/><text x="588" y="182" fill="#1c3a5c">1</text>
    <rect x="622" y="160" width="60" height="34" fill="#eef1f4"/><text x="652" y="182" fill="#aab4bd">0</text>
    <!-- ARL1 -->
    <rect x="558" y="200" width="60" height="34" fill="#5b9bd6"/><text x="588" y="222" fill="#ffffff" font-weight="bold">2</text>
    <rect x="622" y="200" width="60" height="34" fill="#eef1f4"/><text x="652" y="222" fill="#aab4bd">0</text>
    <!-- GAPDH -->
    <rect x="558" y="240" width="60" height="34" fill="#eef1f4"/><text x="588" y="262" fill="#aab4bd">0</text>
    <rect x="622" y="240" width="60" height="34" fill="#9ec7ea"/><text x="652" y="262" fill="#1c3a5c">1</text>
  </g>

  <!-- counting rule -->
  <rect x="720" y="150" width="232" height="124" rx="10" fill="#f4f7fb" stroke="#9fb3c8"/>
  <text x="836" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4660">The counting rule</text>
  <g font-size="11">
    <rect x="736" y="186" width="14" height="14" fill="#ef9a3d"/><rect x="750" y="186" width="14" height="14" fill="#ef9a3d"/>
    <text x="772" y="197" fill="#33485e">same UMI &#8594; <tspan font-style="italic">1 molecule</tspan></text>
    <rect x="736" y="208" width="14" height="14" fill="#6bbf59"/><rect x="750" y="208" width="14" height="14" fill="#9b6dd1"/>
    <text x="772" y="219" fill="#33485e">different UMIs &#8594; <tspan font-style="italic">count each</tspan></text>
  </g>
  <line x1="736" y1="232" x2="936" y2="232" stroke="#cdd8e2"/>
  <text x="836" y="250" text-anchor="middle" font-size="10.5" fill="#55687a">Collapsing PCR copies on the UMI</text>
  <text x="836" y="265" text-anchor="middle" font-size="10.5" fill="#55687a">removes amplification bias</text>

  <!-- footer caption strip -->
  <rect x="34" y="404" width="918" height="46" rx="8" fill="#eef2f6" stroke="#c4cdd6"/>
  <text x="493" y="425" text-anchor="middle" font-size="11.5" fill="#45525f">The cell barcode demultiplexes the pooled library back into single cells; the UMI then collapses PCR copies within each cell.</text>
  <text x="493" y="441" text-anchor="middle" font-size="11.5" fill="#45525f">Result: every cell becomes one column of molecule counts &#8212; the substrate for all downstream analysis.</text>
</svg>
