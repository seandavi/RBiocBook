<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">One cell barcode, two genes, four reads</text>
  <text x="460" y="48" text-anchor="middle" font-size="12.5" fill="#666">Cell barcode CB1 &#183; the UMI decides which reads are PCR copies</text>

  <!-- legend for read structure -->
  <g font-size="11">
    <rect x="60" y="70" width="22" height="16" fill="#5b8def"/><text x="86" y="83" fill="#333">cell barcode</text>
    <rect x="175" y="70" width="22" height="16" fill="#e8a13a"/><text x="201" y="83" fill="#333">UMI</text>
    <rect x="250" y="70" width="22" height="16" fill="#7bc47f"/><text x="276" y="83" fill="#333">cDNA / gene</text>
  </g>

  <!-- ============ LEFT: ACTB, same UMI ============ -->
  <text x="240" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6b2b">Gene ACTB &#8212; same UMI</text>

  <!-- read 1 -->
  <g>
    <rect x="80" y="135" width="40" height="20" fill="#5b8def"/><text x="100" y="150" text-anchor="middle" font-size="10" fill="#fff">CB1</text>
    <rect x="120" y="135" width="40" height="20" fill="#e8a13a"/><text x="140" y="150" text-anchor="middle" font-size="10" fill="#fff">U_07</text>
    <rect x="160" y="135" width="80" height="20" fill="#7bc47f"/><text x="200" y="150" text-anchor="middle" font-size="10" fill="#19431a">ACTB</text>
  </g>
  <!-- read 2 -->
  <g>
    <rect x="80" y="162" width="40" height="20" fill="#5b8def"/><text x="100" y="177" text-anchor="middle" font-size="10" fill="#fff">CB1</text>
    <rect x="120" y="162" width="40" height="20" fill="#e8a13a"/><text x="140" y="177" text-anchor="middle" font-size="10" fill="#fff">U_07</text>
    <rect x="160" y="162" width="80" height="20" fill="#7bc47f"/><text x="200" y="177" text-anchor="middle" font-size="10" fill="#19431a">ACTB</text>
  </g>

  <line x1="270" y1="159" x2="320" y2="159" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="295" y="150" text-anchor="middle" font-size="10.5" fill="#666">collapse</text>

  <g>
    <rect x="330" y="148" width="120" height="24" rx="5" fill="#d8efd9" stroke="#2b6b2b"/>
    <text x="390" y="165" text-anchor="middle" font-size="12" fill="#19431a">ACTB = 1 molecule</text>
  </g>
  <text x="240" y="205" text-anchor="middle" font-size="11" fill="#777">identical UMI &#8594; PCR duplicates of one transcript</text>

  <!-- divider -->
  <line x1="60" y1="232" x2="860" y2="232" stroke="#e3e3e3" stroke-width="1"/>

  <!-- ============ RIGHT: ARL1, different UMIs ============ -->
  <text x="240" y="268" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a4b9c">Gene ARL1 &#8212; different UMIs</text>

  <g>
    <rect x="80" y="283" width="40" height="20" fill="#5b8def"/><text x="100" y="298" text-anchor="middle" font-size="10" fill="#fff">CB1</text>
    <rect x="120" y="283" width="40" height="20" fill="#e8a13a"/><text x="140" y="298" text-anchor="middle" font-size="10" fill="#fff">U_31</text>
    <rect x="160" y="283" width="80" height="20" fill="#7bc47f"/><text x="200" y="298" text-anchor="middle" font-size="10" fill="#19431a">ARL1</text>
  </g>
  <g>
    <rect x="80" y="310" width="40" height="20" fill="#5b8def"/><text x="100" y="325" text-anchor="middle" font-size="10" fill="#fff">CB1</text>
    <rect x="120" y="310" width="40" height="20" fill="#e8a13a"/><text x="140" y="325" text-anchor="middle" font-size="10" fill="#fff">U_88</text>
    <rect x="160" y="310" width="80" height="20" fill="#7bc47f"/><text x="200" y="325" text-anchor="middle" font-size="10" fill="#19431a">ARL1</text>
  </g>

  <line x1="270" y1="320" x2="320" y2="320" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="295" y="311" text-anchor="middle" font-size="10.5" fill="#666">keep both</text>

  <g>
    <rect x="330" y="309" width="120" height="24" rx="5" fill="#efdcf3" stroke="#8a4b9c"/>
    <text x="390" y="326" text-anchor="middle" font-size="12" fill="#4a2456">ARL1 = 2 molecules</text>
  </g>
  <text x="240" y="360" text-anchor="middle" font-size="11" fill="#777">distinct UMIs &#8594; two separate transcripts</text>

  <!-- ============ takeaway box ============ -->
  <rect x="500" y="135" width="360" height="198" rx="10" fill="#f4f7fb" stroke="#9fb3c8"/>
  <text x="680" y="162" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4660">The counting rule</text>
  <g font-size="12.5" fill="#33485e">
    <text x="522" y="192">same  CB + UMI + gene</text>
    <text x="522" y="212" font-style="italic" fill="#6b7d8e">&#8594; one original molecule (collapse)</text>
    <text x="522" y="244">same  CB + gene, different UMI</text>
    <text x="522" y="264" font-style="italic" fill="#6b7d8e">&#8594; distinct molecules (count each)</text>
  </g>
  <line x1="522" y1="284" x2="838" y2="284" stroke="#cdd8e2"/>
  <text x="680" y="308" text-anchor="middle" font-size="11.5" fill="#55687a">Deduplicating on the UMI removes</text>
  <text x="680" y="324" text-anchor="middle" font-size="11.5" fill="#55687a">PCR amplification bias from the counts</text>
</svg>
