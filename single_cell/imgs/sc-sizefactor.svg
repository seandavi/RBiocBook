<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sf-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ===== section label + premise ===== -->
  <text x="40" y="24" font-size="13.5" font-weight="bold" fill="#2c3742">Raw counts — sequencing depth differs</text>
  <text x="40" y="42" font-size="12" font-style="italic" fill="#5a6a78">all three cells are the same cell type</text>

  <!-- gene legend -->
  <g font-size="11" fill="#42505f">
    <rect x="486" y="14" width="11" height="11" fill="#4e79a7"/><text x="501" y="24">gene 1</text>
    <rect x="486" y="30" width="11" height="11" fill="#59a14f"/><text x="501" y="40">gene 2</text>
    <rect x="600" y="14" width="11" height="11" fill="#e1a14c"/><text x="615" y="24">gene 3</text>
    <rect x="600" y="30" width="11" height="11" fill="#af7aa1"/><text x="615" y="40">gene 4</text>
  </g>

  <!-- ===== raw bars (baseline y=185) ===== -->
  <line x1="92" y1="185" x2="628" y2="185" stroke="#b8c0c9" stroke-width="1"/>
  <!-- cell 1 (shallow, s≈0.5) -->
  <g>
    <rect x="100" y="171.5" width="16" height="13.5" fill="#4e79a7"/>
    <rect x="121" y="162.5" width="16" height="22.5" fill="#59a14f"/>
    <rect x="142" y="176"   width="16" height="9"    fill="#e1a14c"/>
    <rect x="163" y="167"   width="16" height="18"   fill="#af7aa1"/>
  </g>
  <!-- cell 2 (medium, s≈1.0) -->
  <g>
    <rect x="320" y="158" width="16" height="27" fill="#4e79a7"/>
    <rect x="341" y="140" width="16" height="45" fill="#59a14f"/>
    <rect x="362" y="167" width="16" height="18" fill="#e1a14c"/>
    <rect x="383" y="149" width="16" height="36" fill="#af7aa1"/>
  </g>
  <!-- cell 3 (deep, s≈1.5) -->
  <g>
    <rect x="540" y="144.5" width="16" height="40.5" fill="#4e79a7"/>
    <rect x="561" y="117.5" width="16" height="67.5" fill="#59a14f"/>
    <rect x="582" y="158"   width="16" height="27"   fill="#e1a14c"/>
    <rect x="603" y="131"   width="16" height="54"   fill="#af7aa1"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1f2d3d">
    <text x="139" y="201">Cell 1 &#183; size factor &#8776; 0.5</text>
    <text x="359" y="201">Cell 2 &#183; size factor &#8776; 1.0</text>
    <text x="579" y="201">Cell 3 &#183; size factor &#8776; 1.5</text>
  </g>

  <!-- ===== transition ===== -->
  <text x="360" y="224" text-anchor="middle" font-size="12.5" font-style="italic" fill="#42505f">divide each cell's counts by its size factor (&#8776; its library size)</text>
  <line x1="360" y1="231" x2="360" y2="258" stroke="#555" stroke-width="1.8" marker-end="url(#sf-arr)"/>

  <!-- ===== normalized bars (baseline y=365) ===== -->
  <text x="40" y="280" font-size="13.5" font-weight="bold" fill="#2c3742">After &#247; size factor — now comparable</text>
  <line x1="92" y1="365" x2="628" y2="365" stroke="#b8c0c9" stroke-width="1"/>
  <!-- identical profiles for all three cells: heights 27/45/18/36 -->
  <g>
    <rect x="100" y="338" width="16" height="27" fill="#4e79a7"/>
    <rect x="121" y="320" width="16" height="45" fill="#59a14f"/>
    <rect x="142" y="347" width="16" height="18" fill="#e1a14c"/>
    <rect x="163" y="329" width="16" height="36" fill="#af7aa1"/>
  </g>
  <g>
    <rect x="320" y="338" width="16" height="27" fill="#4e79a7"/>
    <rect x="341" y="320" width="16" height="45" fill="#59a14f"/>
    <rect x="362" y="347" width="16" height="18" fill="#e1a14c"/>
    <rect x="383" y="329" width="16" height="36" fill="#af7aa1"/>
  </g>
  <g>
    <rect x="540" y="338" width="16" height="27" fill="#4e79a7"/>
    <rect x="561" y="320" width="16" height="45" fill="#59a14f"/>
    <rect x="582" y="347" width="16" height="18" fill="#e1a14c"/>
    <rect x="603" y="329" width="16" height="36" fill="#af7aa1"/>
  </g>
  <!-- alignment cue: the same profile now sits at the same height across cells -->
  <line x1="92" y1="320" x2="628" y2="320" stroke="#59a14f" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
  <text x="360" y="389" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6a78">identical profiles &#8594; one cell type, depth removed</text>
</svg>
